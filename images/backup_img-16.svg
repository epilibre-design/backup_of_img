<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <defs>
    <clipPath id="p">
      <rect x="1" y="1" width="11" height="9" rx="1"/>
    </clipPath>
  </defs>

  <!-- Cadre photo -->
  <rect x="1" y="1" width="11" height="9" rx="1" fill="#3b82f6"/>

  <!-- Paysage simplifié -->
  <g clip-path="url(#p)">
    <polygon points="1,10 6,4 11,10" fill="#15803d"/>
    <circle cx="9.5" cy="3" r="1.8" fill="#fde047"/>
  </g>

  <!-- Bordure cadre -->
  <rect x="1" y="1" width="11" height="9" rx="1" fill="none" stroke="white" stroke-width="1"/>

  <!-- Flèche circulaire (centre 13,13, rayon 2.5) -->
  <path d="M 10.5 13 A 2.5 2.5 0 1 1 13 15.5"
        fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="12,14.5 14,15.5 12,16.5" fill="#1d4ed8"/>
</svg>
